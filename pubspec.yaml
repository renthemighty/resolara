name: resolara
description: Resolara — mobile-first clinical visualization for licensed healthcare professionals.
publish_to: 'none'
version: 1.1.0+11

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Local encrypted DB
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^10.1.4
  uuid: ^4.5.1

  # Camera / image input
  image_picker: ^1.1.2
  file_picker: ^8.3.4

  # Image processing (EXIF/metadata stripping)
  image: ^4.5.4

  # On-device OCR
  google_mlkit_text_recognition: ^0.13.1

  # PDF rendering to images (on-device)
  pdfx: ^2.8.0

  # File encryption (AES-256 for saved visualizations)
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  speech_to_text: ^7.0.0
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  drift_dev: ^2.23.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/SMALL-Resolara_V5.png"
  background_color: "#0E3A29"
  ios_background_color: "#0E3A29"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/font/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Light.ttf
          weight: 300
        - asset: assets/font/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/font/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/font/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/font/Satoshi-Black.ttf
          weight: 900
        - asset: assets/font/Satoshi-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/font/Satoshi-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/Satoshi-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/font/Satoshi-BoldItalic.ttf
          weight: 700
          style: italic
